<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Here to Slay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- ── Join screen: shown until you join a room ───────────────────────── -->
  <div id="join-screen" class="screen">
    <div class="panel">
      <h1>Here to Slay</h1>
      <label>Room
        <input id="room-input" value="table1" autocomplete="off">
      </label>
      <label>Your name
        <input id="name-input" value="" placeholder="Player" autocomplete="off">
      </label>
      <button id="join-btn">Join</button>
      <p class="hint">Open this page in several tabs (or share the URL) and join the
        same room to play together.</p>
    </div>
  </div>

  <!-- ── Lobby: shown after joining, before the game starts ─────────────── -->
  <div id="lobby-screen" class="screen hidden">
    <div class="panel">
      <h1>Lobby — <span id="lobby-room"></span></h1>
      <ul id="lobby-players"></ul>
      <button id="start-btn">Start game</button>
      <p class="hint">Need at least 2 players. Anyone can start.</p>
    </div>
  </div>

  <!-- ── Game board ─────────────────────────────────────────────────────── -->
  <div id="game-screen" class="screen hidden">
    <header id="topbar">
      <span id="phase-pill" class="pill"></span>
      <span id="turn-pill" class="pill"></span>
      <span class="pill">Deck: <b id="deck-count">0</b></span>
      <span class="pill pill--btn" id="discard-pill">Discard: <span id="discard-top">—</span></span>
    </header>

    <!-- Contextual banner: whose turn / challenge window / modifier / prompt -->
    <section id="prompt-panel"></section>

    <section id="opponents"></section>

    <section class="board-block">
      <h2>Monster Row</h2>
      <div id="monster-row" class="card-row"></div>
    </section>

    <section class="board-block" id="me-block">
      <h2>You <span id="me-name"></span> — AP: <b id="me-ap">0</b></h2>
      <div class="subrow">
        <div>
          <h3>Leader</h3>
          <div id="me-leader" class="card-row"></div>
        </div>
        <div class="grow">
          <h3>Party</h3>
          <div id="me-party" class="card-row"></div>
        </div>
      </div>
      <h3>Hand</h3>
      <div id="me-hand" class="card-row"></div>
      <div id="action-bar">
        <button data-act="draw_card">Draw (1 AP)</button>
        <button data-act="discard_all">Discard all (3 AP)</button>
        <button data-act="end_turn">End turn</button>
      </div>
    </section>

    <!-- ── Event log: public play-by-play, newest at the bottom ──────────── -->
    <aside id="game-log">
      <div id="game-log-header">Game Log</div>
      <div id="game-log-entries"></div>
    </aside>
  </div>

  <!-- ── Discard pile modal ────────────────────────────────────────────────── -->
  <div id="discard-modal" class="hidden">
    <div id="discard-modal-inner">
      <div id="discard-modal-header">
        <span>Discard Pile</span>
        <button id="discard-close-btn">✕</button>
      </div>
      <div id="discard-card-grid"></div>
    </div>
  </div>

  <div id="error-toast" class="hidden"></div>

  <!-- ── Action overlay: floats centred, shown for all non-ACTION phases ──── -->
  <div id="action-overlay" class="hidden">
    <div id="action-overlay-inner">
      <!-- countdown timer circle (top-right corner) -->
      <div id="ao-timer" class="hidden">
        <svg viewBox="0 0 36 36" width="46" height="46">
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="#2a5035" stroke-width="3.5"/>
          <circle id="timer-arc" cx="18" cy="18" r="15.9" fill="none" stroke="#f2c14e"
            stroke-width="3.5" stroke-dasharray="100 0" stroke-linecap="round"
            transform="rotate(-90 18 18)"/>
        </svg>
        <span id="timer-secs"></span>
      </div>
      <!-- who + what they're doing -->
      <div id="ao-label"></div>
      <!-- card being played / contested / rolled for -->
      <div id="ao-card-area"></div>
      <!-- dice (challenge always; hero/monster only during ROLL_PENDING) -->
      <div id="ao-dice-section" class="hidden">
        <div id="roll-who"></div>
        <div id="roll-dice"></div>
        <div id="roll-total"></div>
      </div>
      <!-- interactive: challenge/modifier/choice buttons live here -->
      <div id="ao-interactive"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
